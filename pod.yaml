apiVersion: v1
kind: Pod
metadata:
  name: jam-companion
spec:
  restartPolicy: Always
  containers:
    - name: web
      image: localhost/jam-companion-web:dev
      ports:
        - containerPort: 5173
          hostPort: 5173
      volumeMounts:
        - name: web-src
          mountPath: /app/src

    - name: api
      image: localhost/jam-companion-api:dev
      ports:
        - containerPort: 8000
          hostPort: 8000
      volumeMounts:
        - name: api-src
          mountPath: /code/app

  volumes:
    - name: web-src
      hostPath:
        path: ./web/src
        type: Directory
    - name: api-src
      hostPath:
        path: ./api/app
        type: Directory
